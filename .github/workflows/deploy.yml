name: Build & Deploy

on:
    push:
        branches:
            - main
    repository_dispatch:
        types:
            - content-update
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@v6.3.0
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Deploy to Cloudflare Workers
              uses: cloudflare/wrangler-action@v3.14.1
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: deploy
                  wranglerVersion: "4"
